name: Update contributions count

on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: update-contributions
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update bio
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: node scripts/update-contributions.mjs
